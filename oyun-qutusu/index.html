<title>Oyun Qutusu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a toy box — six chunky colored game tiles on a mint ground; every game opens as a one-screen console with a big prompt on top and press-down answer cards below */
:root{
  --bg:#CDEEE3; --bg-ring:rgba(255,255,255,.5); --ink:#25224F; --ink-soft:#57548A;
  --card:#FFFFFF; --shade:rgba(37,34,79,.16); --blob-shade:rgba(0,0,0,.09);
  --coral:#FF6A55; --coral-deep:#D9472F; --sun:#FFC73A; --sun-deep:#E0A417;
  --grape:#7A5CFA; --grape-deep:#5A3ED6; --leaf:#22B36B; --leaf-deep:#178A50;
  --sky:#2F9BEA; --sky-deep:#1B76BA; --berry:#EE4F8C; --berry-deep:#C02F68;
  --on-accent:#FFFFFF;
  --display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

.waves{position:fixed;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 96% 4%, var(--bg-ring) 0 7px, transparent 7px 52px);
  -webkit-mask-image:radial-gradient(circle at 96% 4%, #000 0 22%, transparent 55%);
  mask-image:radial-gradient(circle at 96% 4%, #000 0 22%, transparent 55%)}
.app{position:relative;height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;overflow-y:auto;overflow-x:hidden;padding-bottom:14px}

/* ---------- Hub ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,66px);line-height:.95;margin:0;letter-spacing:-.01em}
h1 span{color:var(--coral)}
.lead{margin:6px 0 0;font-size:clamp(16px,4.2vw,20px);color:var(--ink-soft)}
.label{margin:0;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.block{display:flex;flex-direction:column;gap:10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:0 5px 0 var(--shade);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,box-shadow .08s;text-align:center}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shade)}
.chip .cn{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1}
.chip .cs{font-size:13px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--grape);color:var(--on-accent);box-shadow:0 5px 0 var(--grape-deep)}
.chip[aria-pressed="true"] .cs{color:var(--on-accent);opacity:.85}
.boxes{display:flex;gap:4px;height:22px;align-items:center}
.boxes i{width:14px;height:14px;border-radius:4px;background:var(--sun)}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{--t:var(--coral);--td:var(--coral-deep);--tf:var(--on-accent);
  background:var(--t);color:var(--tf);border-radius:28px;padding:16px 14px 14px;box-shadow:0 7px 0 var(--td);
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--td)}
.tile .te{font-size:clamp(34px,9vw,46px);line-height:1.1;letter-spacing:2px}
.tile .tn{font-family:var(--display);font-weight:800;font-size:clamp(19px,5vw,25px);line-height:1.05}
.tile .td{font-size:14px;opacity:.9;line-height:1.25}
.t-sounds{--t:var(--coral);--td:var(--coral-deep)}
.t-colors{--t:var(--sun);--td:var(--sun-deep);--tf:var(--ink)}
.t-count{--t:var(--leaf);--td:var(--leaf-deep)}
.t-shadow{--t:var(--grape);--td:var(--grape-deep)}
.t-letters{--t:var(--sky);--td:var(--sky-deep)}
.t-memory{--t:var(--berry);--td:var(--berry-deep)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.pill{background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 var(--shade);font-weight:800;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill[aria-pressed="false"]{color:var(--ink-soft)}

/* ---------- Game chrome ---------- */
.topbar{display:flex;align-items:center;gap:12px}
.icon-btn{width:52px;height:52px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--shade);display:grid;place-items:center;flex:none}
.icon-btn svg{width:26px;height:26px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.dots{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--shade)}
.dot.now{background:var(--coral);box-shadow:none;transform:scale(1.25)}
.dot.star{background:var(--sun);box-shadow:none}
.dot.done{background:var(--grape);box-shadow:none}
.tb-title{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:4px}
.visual{display:flex;justify-content:center;align-items:center;width:100%}
.ask-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.ask{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,30px);text-align:center;text-wrap:balance}

.speaker{position:relative;width:clamp(120px,32vw,164px);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--coral);box-shadow:0 8px 0 var(--coral-deep);display:grid;place-items:center;transition:transform .08s,box-shadow .08s;flex:none}
.speaker.sm{width:54px;box-shadow:0 4px 0 var(--coral-deep)}
.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-deep)}
.speaker svg{width:48%;height:48%;color:var(--on-accent);position:relative}
.ring{position:absolute;inset:0;border-radius:50%;border:5px solid var(--coral);opacity:0;pointer-events:none}
.speaker.sm .ring{border-width:3px}
.speaker.playing .ring{animation:wave 1.35s ease-out infinite}
.speaker.playing .r2{animation-delay:.45s}
.speaker.playing .r3{animation-delay:.9s}
@keyframes wave{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.95);opacity:0}}

.cards{display:grid;gap:14px;align-content:start;width:100%}
.cards.n2{grid-template-columns:repeat(2,1fr);max-width:520px;margin:0 auto}
.cards.n3{grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto}
.cards.n4{grid-template-columns:repeat(2,1fr);max-width:520px;margin:0 auto}
@media (min-width:700px){.cards.n4{grid-template-columns:repeat(4,1fr);max-width:none}}
.card{background:var(--card);border-radius:28px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 7px 0 var(--shade);border:4px solid transparent;transition:transform .08s,box-shadow .08s,opacity .3s;text-align:center;min-width:0}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shade)}
.card .em{font-size:clamp(44px,12vw,84px);line-height:1.05}
.card .w{font-family:var(--display);font-weight:800;font-size:clamp(16px,4.3vw,23px);line-height:1.1;overflow-wrap:anywhere}
.card.right{border-color:var(--leaf);animation:pop .55s}
.card.wrong{animation:shake .42s}
.card.nope{opacity:.38}
.card.fade{opacity:.3}
@keyframes pop{30%{transform:scale(1.1) rotate(-3deg)}60%{transform:scale(.97) rotate(2deg)}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* game-specific visuals */
.paint{font-size:clamp(84px,22vw,120px);line-height:1}
.blob{width:74%;max-width:130px;aspect-ratio:1;background:var(--c);box-shadow:inset 0 0 0 3px var(--shade),inset -10px -12px 0 var(--blob-shade)}
.o-colors .card{padding-block:18px}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;background:var(--card);border-radius:28px;padding:14px 16px;max-width:560px;box-shadow:0 6px 0 var(--shade)}
.tray button{font-size:clamp(36px,9.5vw,54px);line-height:1.1;border-radius:14px;position:relative;padding:2px}
.tray button.counted{transform:scale(.9)}
.tray button.counted::after{content:attr(data-n);position:absolute;top:-2px;right:-6px;background:var(--coral);color:var(--on-accent);font:800 14px/22px var(--body);border-radius:999px;min-width:22px;height:22px;padding:0 4px}
.num{font-family:var(--display);font-weight:800;font-size:clamp(48px,13vw,78px);line-height:1;color:var(--grape)}
.shadow-pic{font-size:clamp(110px,30vw,170px);line-height:1;filter:brightness(0);opacity:.82;transition:filter .6s,opacity .6s,transform .6s}
.shadow-pic.shown{filter:none;opacity:1;transform:scale(1.06)}
.letter{font-family:var(--display);font-weight:800;font-size:clamp(100px,28vw,160px);line-height:.9;color:var(--sky);display:flex;align-items:baseline;gap:.08em}
.letter small{font-size:.55em;color:var(--coral)}
.cards.reveal .first{color:var(--coral)}

/* memory */
.mgrid{display:grid;gap:12px;width:100%;margin:auto}
.mgrid.c3{grid-template-columns:repeat(3,1fr);max-width:460px}
.mgrid.c4{grid-template-columns:repeat(4,1fr);max-width:600px}
.mcard{aspect-ratio:3/4;max-width:100%;perspective:800px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 5px 0 var(--shade)}
.face.back{background:var(--berry);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);
  background-image:repeating-radial-gradient(circle at 50% 50%, transparent 0 10px, var(--bg-ring) 10px 13px)}
.face.front{background:var(--card);transform:rotateY(180deg);font-size:clamp(34px,10vw,62px)}
.mcard.got .face.front{box-shadow:0 0 0 4px var(--leaf),0 5px 0 var(--shade)}
.mcard.got{animation:pop .55s}

/* end */
.end-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.end-wrap h2{font-family:var(--display);font-weight:800;font-size:clamp(46px,13vw,80px);margin:0;line-height:1}
.end-wrap p{margin:0;font-size:20px;color:var(--ink-soft);max-width:28ch}
.starrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:clamp(26px,7vw,40px);max-width:520px}
.starrow .off{filter:grayscale(1);opacity:.3}
.end-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:520px}
.big{border-radius:24px;padding:16px 12px;font-family:var(--display);font-weight:800;font-size:clamp(19px,5.4vw,26px);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px)}
.big.play{background:var(--coral);color:var(--on-accent);box-shadow:0 7px 0 var(--coral-deep)}
.big.alt{background:var(--sun);color:var(--ink);box-shadow:0 7px 0 var(--sun-deep)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="waves" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="app">
  <!-- HUB -->
  <section id="hub" class="screen">
    <header class="hero">
      <div>
        <h1>Oyun Qutusu<span>!</span></h1>
        <p class="lead">Dinlə, say, tap. 7 yaşa qədər uşaqlar üçün 6 oyun.</p>
      </div>
    </header>
    <div class="block">
      <h2 class="label">Uşağın yaşı</h2>
      <div class="chips" id="levels"></div>
    </div>
    <div class="block">
      <h2 class="label">Oyunu seç</h2>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="foot">
      <span class="pill">⭐ Cəmi ulduz: <span id="totalStars">0</span></span>
      <button class="pill" id="btnVoice" type="button" aria-pressed="true">🗣️ Danışan səs: <span id="voiceState">açıq</span></button>
    </div>
  </section>

  <!-- QUIZ (5 games share this screen) -->
  <section id="quiz" class="screen" hidden>
    <div class="topbar">
      <button class="icon-btn back" type="button" aria-label="Oyunlara qayıt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="dots" id="dots"></div>
      <span class="pill">⭐ <span id="qStars">0</span></span>
    </div>
    <div class="stage">
      <div class="visual" id="qVisual"></div>
      <div class="ask-row">
        <p class="ask" id="qAsk"></p>
        <button class="speaker sm" id="qReplay" type="button" aria-label="Sualı yenidən dinlə"></button>
      </div>
    </div>
    <div class="cards" id="qCards"></div>
  </section>

  <!-- MEMORY -->
  <section id="memory" class="screen" hidden>
    <div class="topbar">
      <button class="icon-btn back" type="button" aria-label="Oyunlara qayıt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-6h3v6h5V9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tb-title">Yaddaş kartları</div>
      <span class="pill">🔄 <span id="mMoves">0</span></span>
    </div>
    <p class="ask">Eyni şəkilləri tap!</p>
    <div class="mgrid" id="mGrid"></div>
  </section>

  <!-- END -->
  <section id="end" class="screen" hidden>
    <div class="end-wrap">
      <div class="starrow" id="endStars"></div>
      <h2 id="endTitle">Əla!</h2>
      <p id="endText"></p>
      <div class="end-actions">
        <button class="big play" id="btnAgain" type="button">Yenə oyna</button>
        <button class="big alt back" type="button">Başqa oyun</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
const $ = s => document.querySelector(s);
const ROUNDS = 8;
const LV = [{n:2,age:'3–4 yaş',max:5},{n:3,age:'5 yaş',max:7},{n:4,age:'6–7 yaş',max:10}];
const store = {
  get(k,d){ try{ const v=localStorage.getItem('oyunqutusu.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('oyunqutusu.'+k, JSON.stringify(v)); }catch(e){} }
};
const state = { lv: store.get('lv',1), voice: store.get('voice',true), total: store.get('total',0), game:null };
const L = () => LV[state.lv] || LV[1];

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sample = (a,k) => shuffle(a.slice()).slice(0,k);
const rand = (lo,hi) => lo + Math.floor(Math.random()*(hi-lo+1));
const lower = w => w.toLocaleLowerCase('az');
const cap = w => w.charAt(0).toLocaleUpperCase('az') + w.slice(1);
function deckOf(pool, len=ROUNDS){
  let d=[]; while(d.length<len){ const s=shuffle(pool.slice()); if(d.length && s[0]===d[d.length-1]) s.push(s.shift()); d=d.concat(s); }
  return d.slice(0,len);
}
let timers=[];
const later = (fn,ms) => timers.push(setTimeout(fn,ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers=[]; };
const SCREENS=['hub','quiz','memory','end'];
const show = id => SCREENS.forEach(s => $('#'+s).hidden = s!==id);

/* ================= Audio engine (synthesized, no files) ================= */
let AC=null, master=null, bus=null, NB=null;
function audio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
    AC=new C(); const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=4;
    master=AC.createGain(); master.gain.value=.85; master.connect(comp).connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function newBus(){
  if(bus){ const old=bus; old.gain.cancelScheduledValues(AC.currentTime); old.gain.setTargetAtTime(0,AC.currentTime,.03); setTimeout(()=>{try{old.disconnect()}catch(e){}},400); }
  bus=AC.createGain(); bus.gain.value=1; bus.connect(master); return bus;
}
function ramp(p,t0,v,sweep){ p.setValueAtTime(v,t0); (sweep||[]).forEach(([x,tt,k]) => k==='e' ? p.exponentialRampToValueAtTime(x,t0+tt) : p.linearRampToValueAtTime(x,t0+tt)); }
function shape(p,t0,{g=.3,a=.01,d=.3,r=.08,env=null,pluck=false}){
  if(pluck){ p.setValueAtTime(g,t0); p.exponentialRampToValueAtTime(.0001,t0+d); return; }
  p.setValueAtTime(.0001,t0);
  if(env){ env.forEach(([v,tt]) => p.linearRampToValueAtTime(v,t0+tt)); return; }
  p.linearRampToValueAtTime(g,t0+a); p.setValueAtTime(g,t0+Math.max(a,d-r)); p.linearRampToValueAtTime(.0001,t0+d);
}
function filt(spec,t0){ const f=AC.createBiquadFilter(); f.type=spec.type||'lowpass'; f.Q.value=spec.Q ?? 1; ramp(f.frequency,t0,spec.f,spec.sweep); return f; }
function tone(out,o){
  const t0=AC.currentTime+.03+(o.t||0), d=o.d||.3;
  const osc=AC.createOscillator(); osc.type=o.type||'sine'; ramp(osc.frequency,t0,o.f,o.sweep);
  const gn=AC.createGain(); shape(gn.gain,t0,{...o,d});
  let src=osc; if(o.filter){ src=filt(o.filter,t0); osc.connect(src); }
  src.connect(gn); gn.connect(out); osc.start(t0); osc.stop(t0+d+.05);
  return {o:osc,gn};
}
function noise(out,o){
  if(!NB){ const len=AC.sampleRate*2; NB=AC.createBuffer(1,len,AC.sampleRate); const ch=NB.getChannelData(0); for(let i=0;i<len;i++) ch[i]=Math.random()*2-1; }
  const t0=AC.currentTime+.03+(o.t||0), d=o.d||.3;
  const s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
  const gn=AC.createGain(); shape(gn.gain,t0,{...o,d});
  let src=s; if(o.filter){ src=filt(o.filter,t0); s.connect(src); }
  src.connect(gn); gn.connect(out); s.start(t0,Math.random()); s.stop(t0+d+.05);
  return {s,gn};
}
function lfo(param,{f=5,depth=10,t=0,d=1,type='sine'}){
  const t0=AC.currentTime+.03+t; const o=AC.createOscillator(); o.type=type; o.frequency.value=f;
  const g=AC.createGain(); g.gain.value=depth; o.connect(g).connect(param); o.start(t0); o.stop(t0+d+.05);
}
const SOUNDS = {
  dog(out){ [0,.34].forEach(t=>{ tone(out,{type:'sawtooth',f:640,t,d:.17,g:.55,a:.004,r:.11,sweep:[[300,.15]],filter:{type:'bandpass',f:1000,Q:1.2}}); noise(out,{t,d:.07,g:.25,a:.003,r:.05,filter:{type:'bandpass',f:1500,Q:1}}); }); },
  cat(out){ const r=tone(out,{type:'sawtooth',f:520,d:.85,g:.6,a:.1,r:.3,sweep:[[780,.28],[640,.55],[470,.85]],filter:{type:'bandpass',f:800,Q:2.5,sweep:[[1700,.3],[1100,.55],[700,.85]]}}); lfo(r.o.frequency,{f:6,depth:12,d:.85}); },
  cow(out){ tone(out,{type:'sawtooth',f:125,d:1.4,g:.6,a:.2,r:.4,sweep:[[118,.6],[100,1.4]],filter:{type:'lowpass',f:250,Q:4,sweep:[[900,.45],[500,1],[300,1.4]]}});

let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/^az/i.test(v.lang))||vs.find(v=>/^tr/i.test(v.lang))||null; }catch(e){} }

function say(text){
  if(!state.voice || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang='az-AZ';
    u.rate=.9; u.pitch=1.15; speechSynthesis.speak(u); }catch(e){}
}

function qDots(){
  const box=$('#dots'); box.innerHTML='';
  for(let i=0;i<ROUNDS;i++){ const s=document.createElement('span');
    s.className='dot'+(i===Q.round&&!Q.locked?' now':'')+(Q.results[i]==='star'?' star':Q.results[i]?' done':''); box.appendChild(s); }
  $('#qStars').textContent=Q.stars;
}
function qRound(){
  const g=GAMES[state.game], t=Q.t=Q.deck[Q.round];
  Q.tried=false; Q.locked=false;
  const vis=$('#qVisual'); vis.innerHTML=''; g.visual(t,vis);
  $('#qAsk').textContent=g.ask(t);
  $('#qReplay').hidden=!!g.bigSpeaker;
  const opts=shuffle(g.options(t));
  const box=$('#qCards'); box.className=`cards n${opts.length} o-${state.game}`; box.innerHTML='';
  opts.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.className='card'; b.innerHTML=o.html; b.setAttribute('aria-label',o.label); b.onclick=()=>qPick(o,b); box.appendChild(b); });
  qDots();
  later(qCue,450);
}
let pulseTimer=0;
function qCue(){
  if(!Q.t || Q.locked) return;
  audio();
  const len=GAMES[state.game].cue(Q.t)||1.5;
  const sps=document.querySelectorAll('#quiz .speaker');
  sps.forEach(s=>s.classList.add('playing')); clearTimeout(pulseTimer);
  pulseTimer=setTimeout(()=>sps.forEach(s=>s.classList.remove('playing')), len*1000+300);
}
function qPick(o,el){
  if(Q.locked || el.classList.contains('nope')) return;
  audio();
  const g=GAMES[state.game], t=Q.t;
  if(o.ok){
    Q.locked=true; clearTimeout(pulseTimer);
    document.querySelectorAll('#quiz .speaker').forEach(s=>s.classList.remove('playing'));
    Q.results[Q.round]=Q.tried?'done':'star'; if(!Q.tried) Q.stars++;
    el.classList.add('right');
    document.querySelectorAll('#qCards .card').forEach(c=>{ if(c!==el) c.classList.add('fade'); });
    g.onRight?.(t,$('#qVisual'),$('#qCards'));
    sfxRight(); qDots();
    const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 46);
    later(()=>say(g.praise(t)),350);
    later(()=>{ Q.round++; Q.round>=ROUNDS ? endGame(Q.stars,ROUNDS,`${ROUNDS} sualdan ${Q.stars}-ni ilk cəhddə tapdın.`) : qRound(); }, 2500);
  } else {
    Q.tried=true;
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong','nope');
    sfxWrong(); say('Yenə cəhd et!');
    later(qCue,1300);
  }
}

/* ================= Memory ================= */
const M={first:null,lock:false,found:0,moves:0,pairs:0};
function startMemory(){
  audio(); clearTimers(); hush(); state.game='memory';
  const pairs=[3,4,6][state.lv]; Object.assign(M,{first:null,lock:false,found:0,moves:0,pairs});
  const pool=sample(ITEMS.filter(i=>i.id!=='police'&&i.id!=='ambul'),pairs);
  const grid=$('#mGrid'); grid.className='mgrid '+(pairs===3?'c3':'c4'); grid.innerHTML='';
  shuffle([...pool,...pool]).forEach(it=>{
    const b=document.createElement('button'); b.type='button'; b.className='mcard'; b.setAttribute('aria-label','Kart');
    b.innerHTML=`<span class="in"><span class="face back" aria-hidden="true">?</span><span class="face front" aria-hidden="true">${it.e}</span></span>`;
    b.onclick=()=>flip(b,it); grid.appendChild(b);
  });
  $('#mMoves').textContent=0;
  show('memory');
  say('Eyni şəkilləri tap!');
}
function flip(b,it){
  if(M.lock || b.classList.contains('up')) return;
  b.classList.add('up'); b.setAttribute('aria-label',it.w); sfxTap(M.first?780:620);
  if(!M.first){ M.first={b,it}; return; }
  const a=M.first; M.first=null; M.moves++; $('#mMoves').textContent=M.moves;
  if(a.it===it){
    a.b.classList.add('got'); b.classList.add('got'); M.found++;
    later(()=>playSound(it.id),250);
    later(()=>say(it.w), 250+it.len*1000);
    const r=b.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 30);
    if(M.found===M.pairs) later(()=>endGame(M.pairs,M.pairs,`${M.pairs} cütü ${M.moves} cəhddə tapdın.`), 900+it.len*1000+900);
  } else {
    M.lock=true;
    later(()=>{ a.b.classList.remove('up'); b.classList.remove('up'); a.b.setAttribute('aria-label','Kart'); b.setAttribute('aria-label','Kart'); M.lock=false; }, 1000);
  }
}

/* ================= End ================= */
function endGame(stars,max,text){
  state.total+=stars; store.set('total',state.total);
  const box=$('#endStars'); box.innerHTML='';
  for(let i=0;i<max;i++){ const s=document.createElement('span'); s.textContent='⭐'; if(i>=stars) s.className='off'; box.appendChild(s); }
  const ratio=stars/max;
  $('#endTitle').textContent = ratio>=.85?'Super!':ratio>=.55?'Əla!':'Yaxşı!';
  $('#endText').textContent = text;
  show('end');
  say(ratio>=.85?'Super! Sən çox ağıllısan!':ratio>=.55?'Əla! Çox yaxşı oynadın!':'Yaxşı! Gəl bir də oynayaq!');
  burst(innerWidth/2, innerHeight/3, 90);
}

/* ================= Hub ================= */
function renderHub(){
  const lv=$('#levels'); lv.innerHTML='';
  LV.forEach((l,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed',String(i===state.lv));
    b.innerHTML=`<span class="boxes" aria-hidden="true">${'<i></i>'.repeat(l.n)}</span><span class="cn">${l.age}</span><span class="cs">${l.n} seçim</span>`;
    b.onclick=()=>{ state.lv=i; store.set('lv',i); renderHub(); };
    lv.appendChild(b);
  });
  const tiles=$('#tiles'); tiles.innerHTML='';
  ORDER.forEach(k=>{ const g=GAMES[k];
    const b=document.createElement('button'); b.type='button'; b.className='tile t-'+k;
    b.innerHTML=`<span class="te" aria-hidden="true">${g.em}</span><span class="tn">${g.name}</span><span class="td">${g.desc}</span>`;
    b.onclick=()=> k==='memory' ? startMemory() : startQuiz(k);
    tiles.appendChild(b);
  });
  $('#totalStars').textContent=state.total;
  $('#btnVoice').setAttribute('aria-pressed',String(state.voice));
  $('#voiceState').textContent=state.voice?'açıq':'bağlı';
}

/* ================= Confetti ================= */
const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,count){
  if(reduce) return;
  const dpr=devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--coral','--sun','--grape','--leaf','--sky','--berry'].map(v=>cs.getPropertyValue(v).trim());
  for(let i=0;i<count;i++) parts.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,s:7+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.35,life:100});
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); cx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<innerHeight+30);
  raf=parts.length?requestAnimationFrame(tick):0;
}

/* ================= Wiring ================= */
$('#qReplay').onclick=qCue;
$('#btnAgain').onclick=()=> state.game==='memory' ? startMemory() : startQuiz(state.game);
$('#btnVoice').onclick=()=>{ state.voice=!state.voice; store.set('voice',state.voice); if(!state.voice) try{speechSynthesis.cancel()}catch(e){}; renderHub(); };
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{ clearTimers(); hush(); Q.t=null; renderHub(); show('hub'); });

renderHub();
})();
</script>
